[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-publisher"
version = "1.1.1"
description = "Локальный инструмент для подготовки и публикации постов в Telegram"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=22,<23",
    "pyperclip>=1.9,<2",
    "keyring>=25,<27",
    "pywebview>=5.4,<7",
    "beautifulsoup4>=4.12,<5",
    "Markdown>=3.6,<4",
    "python-docx>=1.1,<2",
    "odfpy>=1.4,<2",
    "charset-normalizer>=3.3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
build = [
    "pyinstaller>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
